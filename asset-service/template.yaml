AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Serverless application template for asset service.

Globals:
  Function:
    Timeout: 20
    MemorySize: 1024
    Runtime: java21
    Architectures:
      - x86_64
    Environment:
      Variables:
        TABLE_NAME: InventoryTable-Dev
        REGION: !Ref AWS::Region

Resources:

  #########################################
  # API Gateway
  #########################################
  InventoryApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: Prod
      EndpointConfiguration:
        Type: REGIONAL
      Name: !Sub '${AWS::StackName}-inventory-api'
      Cors:
        AllowHeaders: "Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token"
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowOrigin: "'*'"

  #########################################
  # IAM Roles
  #########################################

  # Lesende Rolle — für List* und Get* Handler
  ReadOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDbReadOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:GetItem
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/InventoryTable-Dev'

  # Schreibende Rolle — für Create*, Update*, Delete*, Assign*, Remove* Handler
  ReadWriteRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDbReadWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeTable
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                Resource:
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/InventoryTable-Dev'

  #########################################
  # Article Handler
  #########################################

  # BE-06: GET /articles
  ListArticlesHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.sakai.inventory.api.handler.ListArticlesHandler::handleRequest
      Role: !GetAtt ReadOnlyRole.Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /articles
            Method: get
            RestApiId: !Ref InventoryApi

  # BE-07: GET /articles/{id}
  GetArticleHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.sakai.inventory.api.handler.GetArticleHandler::handleRequest
      Role: !GetAtt ReadOnlyRole.Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /articles/{id}
            Method: get
            RestApiId: !Ref InventoryApi

  # BE-08: POST /articles
  CreateArticleHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.sakai.inventory.api.handler.CreateArticleHandler::handleRequest
      Role: !GetAtt ReadWriteRole.Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /articles
            Method: post
            RestApiId: !Ref InventoryApi

  # BE-09: PUT /articles/{id}
  UpdateArticleHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.sakai.inventory.api.handler.UpdateArticleHandler::handleRequest
      Role: !GetAtt ReadWriteRole.Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /articles/{id}
            Method: put
            RestApiId: !Ref InventoryApi

  # BE-10: DELETE /articles/{id}
  DeleteArticleHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.sakai.inventory.api.handler.DeleteArticleHandler::handleRequest
      Role: !GetAtt ReadWriteRole.Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /articles/{id}
            Method: delete
            RestApiId: !Ref InventoryApi

  #########################################
  # Catalog Handler
  #########################################

  # BE-11: GET /catalogs
  ListCatalogsHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.sakai.inventory.api.handler.ListCatalogsHandler::handleRequest
      Role: !GetAtt ReadOnlyRole.Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /catalogs
            Method: get
            RestApiId: !Ref InventoryApi

  # BE-12: GET /catalogs/{id}
  GetCatalogHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.sakai.inventory.api.handler.GetCatalogHandler::handleRequest
      Role: !GetAtt ReadOnlyRole.Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /catalogs/{id}
            Method: get
            RestApiId: !Ref InventoryApi

  # BE-13: POST /catalogs
  CreateCatalogHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.sakai.inventory.api.handler.CreateCatalogHandler::handleRequest
      Role: !GetAtt ReadWriteRole.Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /catalogs
            Method: post
            RestApiId: !Ref InventoryApi

  # BE-14: PUT /catalogs/{id}
  UpdateCatalogHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.sakai.inventory.api.handler.UpdateCatalogHandler::handleRequest
      Role: !GetAtt ReadWriteRole.Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /catalogs/{id}
            Method: put
            RestApiId: !Ref InventoryApi

  # BE-15: DELETE /catalogs/{id}
  DeleteCatalogHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.sakai.inventory.api.handler.DeleteCatalogHandler::handleRequest
      Role: !GetAtt ReadWriteRole.Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /catalogs/{id}
            Method: delete
            RestApiId: !Ref InventoryApi

  #########################################
  # Relationen & Zuweisungen
  #########################################

  # BE-16: POST /catalogs/{id}/articles
  AssignArticleToCatalogHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.sakai.inventory.api.handler.AssignArticleToCatalogHandler::handleRequest
      Role: !GetAtt ReadWriteRole.Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /catalogs/{id}/articles
            Method: post
            RestApiId: !Ref InventoryApi

  # BE-17: DELETE /catalogs/{id}/articles/{articleId}
  RemoveArticleFromCatalogHandler:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: com.sakai.inventory.api.handler.RemoveArticleFromCatalogHandler::handleRequest
      Role: !GetAtt ReadWriteRole.Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /catalogs/{id}/articles/{articleId}
            Method: delete
            RestApiId: !Ref InventoryApi

  # Hinweis: Die DynamoDB-Tabelle wird von CDK verwaltet (InventoryTable-Dev).
  # Sie wird hier NICHT neu erstellt — nur referenziert.

Outputs:
  ApiEndpoint:
    Description: API Gateway Basis-URL (Prod Stage)
    Value: !Sub 'https://${InventoryApi}.execute-api.${AWS::Region}.amazonaws.com/Prod'
  ArticlesEndpoint:
    Description: Endpunkt für Articles
    Value: !Sub 'https://${InventoryApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/articles'
  CatalogsEndpoint:
    Description: Endpunkt für Catalogs
    Value: !Sub 'https://${InventoryApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/catalogs'
  DynamoDbTableName:
    Description: Name der DynamoDB-Tabelle (CDK-verwaltet)
    Value: InventoryTable-Dev
